<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact – Ragophala Digital</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="contact.html">
<section class="section"><div class="container contact-grid">
  <div>
    <h1 style="font-size:clamp(2.2rem,4.5vw,3.2rem)">Contact Us</h1>
    <p style="color:var(--muted);margin:10px 0 30px">Let's discuss your project.</p>
    <ul class="info">
      <li><span class="ico">📞</span>+27 11 224 567</li>
      <li><span class="ico">✉️</span>hello@ragophala.digital</li>
      <li><span class="ico">📍</span>Cape Town, SA</li>
    </ul>
    <div class="socials"><a href="#">in</a><a href="#">f</a><a href="#">ig</a></div>
    <div data-art="pin" style="width:90px;margin-top:20px"></div>
  </div>
  <form class="glass" data-contact>
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Message" required></textarea>
    <button class="btn btn-primary" type="submit">Send Message</button>
    <p class="form-ok">Thanks! We'll be in touch shortly.</p>
  </form>
</div></section>
<script src="script.js"></script></body></html>
